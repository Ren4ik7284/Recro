<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="recroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141a"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>

    <!-- Recro Brand Neon Gradient -->
    <linearGradient id="recroNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="recroGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Border Highlight -->
    <linearGradient id="recroBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>

    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#8b5cf6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#recroBg)"/>
  <rect x="20" y="20" width="472" height="472" rx="118" fill="none" stroke="url(#recroBorder)" stroke-width="4"/>

  <!-- Core Ambient Glow -->
  <circle cx="256" cy="240" r="210" fill="url(#recroGlow)"/>

  <!-- Futuristic Monogram R (Soundbar stem + sonic arc + playback sweep) -->
  <!-- 1. Vertical Soundbar Spine -->
  <rect x="120" y="112" width="48" height="288" rx="24" fill="url(#recroNeon)" filter="url(#neonShadow)"/>

  <!-- 2. Smooth Sonic Arc (Top Loop of R) -->
  <path d="M 168 136 H 262 C 322 136 362 172 362 226 C 362 280 322 316 262 316 H 168" 
        fill="none" stroke="url(#recroNeon)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonShadow)"/>

  <!-- 3. Dynamic Forward Sweep (Leg of R) -->
  <path d="M 252 300 L 350 400" 
        fill="none" stroke="url(#recroNeon)" stroke-width="48" stroke-linecap="round" filter="url(#neonShadow)"/>

  <!-- 4. Play Node Accent inside the loop -->
  <circle cx="250" cy="226" r="15" fill="#38bdf8"/>
</svg>
