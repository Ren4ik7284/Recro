<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Recro</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Recro">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=recro2">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v=recro2">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=recro2">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=recro2">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    (function() {
      window.__pwaDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
      });
      window.addEventListener('appinstalled', function() {
        window.__pwaDeferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <script>
    if ('serviceWorker' in navigator) {
      var hadController = Boolean(navigator.serviceWorker.controller);
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (hadController && !refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });

      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {
          reg.update();
          if (reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
          reg.addEventListener('updatefound', function() {
            var newWorker = reg.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', function() {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            }
          });
        }).catch(function() {});
      });
    }
  </script>
</body>
</html>
