  <script>
    (function() {
      window.__pwaDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
      });
      window.addEventListener('appinstalled', function() {
        window.__pwaDeferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    })();
  </script>
  <script>
    (function() {
      try {
        var preset = localStorage.getItem('recro_bg_preset');
        var customUrl = localStorage.getItem('recro_bg_custom_url');
        var fastPreview = localStorage.getItem('recro_bg_fast_preview');
        var url = fastPreview || (customUrl && !customUrl.startsWith('blob:') ? customUrl : '');
        if (preset === 'custom' && url) {
          var style = document.createElement('style');
          style.id = 'early-bg-style';
          style.innerHTML = 'body, app-root, .live-bg-container { background-image: url("' + url + '") !important; background-size: cover !important; background-position: center !important; }';
          document.head.appendChild(style);
        }
      } catch (e) {}
    })();
  </script>
<link rel="stylesheet" href="styles-TUSGOMQJ.css"></head>
<body>
  <app-root>
    <div style="position:fixed;inset:0;background:#09090b;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:99999;">

      <div style="width:160px;height:3px;background:#27272a;border-radius:2px;margin-top:10px;overflow:hidden;">
        <div id="recro-bar" style="width:100%;height:100%;background:#2563eb;box-shadow:0 0 8px rgba(59,130,246,0.6);animation:loadingpulse 1.2s ease-in-out infinite;"></div>
      </div>
      <style>
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes loadingpulse{0%,100%{opacity:0.3}50%{opacity:1}}
      </style>
    </div>
