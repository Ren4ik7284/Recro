  <script>
    // Safe recovery for stale / broken bundles: catch script loading errors without infinite reload loops
    window.addEventListener('error', function(e) {
      if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
        try {
          if (!sessionStorage.getItem('recro_pwa_recovered')) {
            sessionStorage.setItem('recro_pwa_recovered', '1');
            if (window.caches) {
              caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              }).then(function() {
                if (navigator.serviceWorker) {
                  return navigator.serviceWorker.getRegistrations().then(function(regs) {
                    return Promise.all(regs.map(function(r) { return r.unregister(); }));
                  });
                }
              }).then(function() {
                window.location.reload();
              }).catch(function() {
                window.location.reload();
              });
            } else {
              window.location.reload();
            }
          }
        } catch (_) {}
      }
    }, true);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js?v=62').then(function(reg) {
          reg.update();
        }).catch(function() {});
      });
    }
  </script>
