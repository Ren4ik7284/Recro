services:
  - type: web
    name: recro
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: TURSO_DATABASE_URL
        value: https://signal-db-ren4ik7284.aws-ap-northeast-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TURSO_API_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
